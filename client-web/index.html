<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DomiClick — Encargos en Villavicencio</title>
    <meta
      name="description"
      content="Plataforma digital para recoger compras prepagadas y encargos locales en Villavicencio."
    />
    <meta name="theme-color" content="#FF5722" />
    <meta name="google-site-verification" content="_4spEHN87G0-nfE6GnfyOScKq3u-YD_H7FT49AvYwD8" />
    <link rel="icon" type="image/png" href="/brand/logo-optimized-transparent.png" />
    <link rel="apple-touch-icon" href="/brand/logo-optimized-transparent.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('domiclick_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:system-ui;color:#e8eef9;background:#05080f">
        DomiClick necesita JavaScript activado para funcionar en este navegador.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
