<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DomiClick Ops — Administración</title>
    <meta name="theme-color" content="#2B6CFF" />
    <meta name="description" content="DomiClick Ops — Torre de control y administración logística en Villavicencio." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/brand/ops-favicon.png" />
    <link rel="apple-touch-icon" href="/brand/ops-logo-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>
      #domiclick-boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #05080f;
        color: #e8eef9;
        font-family: system-ui, sans-serif;
      }
      #domiclick-boot .spin {
        width: 44px;
        height: 44px;
        border: 2px solid #2b6cff;
        border-top-color: transparent;
        border-radius: 50%;
        animation: domiclick-spin 0.8s linear infinite;
      }
      @keyframes domiclick-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="domiclick-boot" aria-live="polite" aria-busy="true">
      <div class="spin" aria-hidden="true"></div>
      <p style="font-size: 14px; font-weight: 600">Cargando DomiClick…</p>
      <p style="font-size: 11px; color: #64748b; max-width: 260px; text-align: center; line-height: 1.4">
        Si tarda más de 30 s, recarga la página o usa «Limpiar caché» cuando aparezca.
      </p>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #e8eef9; background: #05080f">
        DomiClick necesita JavaScript activado para funcionar en este navegador.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var boot = document.getElementById('domiclick-boot');
        var root = document.getElementById('root');
        var slowTimer = setTimeout(function () {
          if (!boot || !root || root.childElementCount > 0) return;
          var hint = document.createElement('p');
          hint.style.cssText =
            'font-size:11px;color:#94a3b8;max-width:280px;text-align:center;line-height:1.5;margin-top:8px';
          hint.textContent =
            'El sitio existe pero la app no terminó de cargar. Prueba limpiar caché o usa datos/WiFi distinto.';
          boot.appendChild(hint);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Limpiar caché y reintentar';
          btn.style.cssText =
            'margin-top:10px;padding:10px 16px;border-radius:10px;border:none;background:#FF5722;color:#fff;font-weight:700;font-size:12px';
          btn.onclick = function () {
            try {
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  regs.forEach(function (r) { r.unregister(); });
                });
              }
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  keys.forEach(function (k) { caches.delete(k); });
                });
              }
            } catch (e) {}
            var u = new URL(window.location.href);
            u.searchParams.set('fresh', String(Date.now()));
            window.location.replace(u.toString());
          };
          boot.appendChild(btn);
        }, 12000);
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && t.tagName === 'SCRIPT' && boot) {
              clearTimeout(slowTimer);
              boot.innerHTML =
                '<p style="font-size:14px;font-weight:700;margin-bottom:8px">No se pudo cargar la app</p>' +
                '<p style="font-size:12px;color:#94a3b8;margin-bottom:12px">Recarga o limpia caché del navegador.</p>' +
                '<button type="button" onclick="location.reload()" style="padding:10px 16px;border-radius:10px;border:none;background:#FF5722;color:#fff;font-weight:700">Recargar</button>';
            }
          },
          true
        );
      })();
    </script>
  </body>
</html>
